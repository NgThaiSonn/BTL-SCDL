services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ptit_chi_nhanh
      MYSQL_USER: ptit_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-ptit_local_demo}
    volumes:
      - bank_data:/var/lib/mysql
      - ./chi_nhanh.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/app-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT COUNT(*) FROM v_du_no'"]
      interval: 5s
      timeout: 4s
      retries: 40
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ptit_app
      DB_PASSWORD: ${DB_PASSWORD:-ptit_local_demo}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  bank_data:
